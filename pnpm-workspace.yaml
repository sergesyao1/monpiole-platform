packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
  - "tools/quality/fixtures/resolver/*"
allowBuilds:
  "@scarf/scarf": false
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.2'
  - '@nestjs/core@11.2.2'
  - '@nestjs/platform-express@11.2.2'
  - '@types/node@26.3.0'
