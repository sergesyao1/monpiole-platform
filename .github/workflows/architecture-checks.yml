name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static/type
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - &setup_node
        name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0

      - &verify_toolchain
        name: Verify toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(corepack pnpm --version)" = "11.22.0"

      - &locate_store
        name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - &cache_store
        name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node-24.18.0-pnpm-11.22.0-${{ hashFiles('pnpm-lock.yaml') }}

      - &install
        name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck tests
        run: corepack pnpm typecheck:tests

  architecture:
    name: architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup_node
      - *verify_toolchain
      - *locate_store
      - *cache_store
      - *install
      - name: Validate architecture
        run: corepack pnpm architecture:check

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup_node
      - *verify_toolchain
      - *locate_store
      - *cache_store
      - *install
      - name: Run unit tests
        run: corepack pnpm test:unit

  integration-contract:
    name: integration/contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup_node
      - *verify_toolchain
      - *locate_store
      - *cache_store
      - *install
      - name: Run non-PostgreSQL integration tests
        run: corepack pnpm test:integration
      - name: Run API and event contract tests
        run: corepack pnpm test:contract

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup_node
      - *verify_toolchain
      - *locate_store
      - *cache_store
      - *install
      - name: Typecheck API
        run: corepack pnpm app:api:typecheck
      - name: Build API
        run: corepack pnpm app:api:build

  events:
    name: events
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup_node
      - *verify_toolchain
      - *locate_store
      - *cache_store
      - *install
      - name: Typecheck event contracts
        run: corepack pnpm package:events:typecheck
      - name: Build event contracts
        run: corepack pnpm package:events:build

  persistence:
    name: persistence/PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup_node
      - *verify_toolchain
      - *locate_store
      - *cache_store
      - *install
      - name: Report Docker versions
        run: docker version
      - name: Typecheck persistence
        run: corepack pnpm package:persistence:typecheck
      - name: Build persistence
        run: corepack pnpm package:persistence:build
      - name: Validate persistence migrations
        run: corepack pnpm package:persistence:migration:check
      - name: Test against Testcontainers PostgreSQL
        run: corepack pnpm package:persistence:test:integration

  required:
    name: required
    if: ${{ always() }}
    needs:
      - static
      - architecture
      - unit
      - integration-contract
      - api
      - events
      - persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every validation job
        shell: bash
        run: |
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.architecture.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.integration-contract.result }}" = "success"
          test "${{ needs.api.result }}" = "success"
          test "${{ needs.events.result }}" = "success"
          test "${{ needs.persistence.result }}" = "success"
